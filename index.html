<style>
:root{--bg:#f4f7fc;--card:#fff;--tx:#0b1b36;--mut:#52648a;--ac:#0e7490;--ac2:#2563eb;--bd:#d5deee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1428;--card:#101d38;--tx:#e6eefc;--mut:#8fa3c7;--ac:#22d3ee;--ac2:#3b82f6;--bd:#1e3358;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1428;--card:#101d38;--tx:#e6eefc;--mut:#8fa3c7;--ac:#22d3ee;--ac2:#3b82f6;--bd:#1e3358;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 14px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;letter-spacing:.3px;color:var(--ac)}.logo small{display:block;font-size:10px;color:var(--mut);font-weight:500}
nav{display:flex;gap:4px;overflow-x:auto;padding-top:6px}
nav a{white-space:nowrap;padding:6px 11px;border-radius:8px;color:var(--mut);text-decoration:none;font-size:14px}
nav a.on{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:16px 14px 30px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.stat b{display:block;font-size:28px;color:var(--ac)}.stat span{color:var(--mut);font-size:13px}
.b{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid var(--c);color:var(--c);margin:1px 3px 1px 0}
.row{padding:10px 0;border-top:1px solid var(--bd)}.row:first-child{border-top:0}
.mut{color:var(--mut);font-size:13px}
.fb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-height:40px}
textarea{width:100%;min-height:90px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
button{cursor:pointer;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;border:0;font-weight:600}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button.d{background:#be123c}
.bar{height:10px;border-radius:5px;background:var(--c);min-width:3px}
.err{background:#be123c22;border:1px solid #be123c;border-radius:8px;padding:8px 12px;margin:8px 0}
.ok{background:#16a34a22;border:1px solid #16a34a;border-radius:8px;padding:10px 12px;margin:8px 0}
.warn{background:#f59e0b22;border:1px solid #f59e0b;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
svg{width:100%;height:auto;background:var(--bg);border-radius:10px;border:1px solid var(--bd)}
svg text{font-family:inherit}
footer{border-top:1px solid var(--bd);padding:14px;font-size:12.5px;color:var(--mut);text-align:center}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .2s}.card:hover{border-color:var(--ac)}}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:660px}th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--bd);vertical-align:top;font-size:14px}th{font-size:12.5px;color:var(--mut)}
.th{background:none;border:0;color:inherit;padding:0;min-height:0;font-weight:700;cursor:pointer}
dl.dd{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:8px 0}dl.dd dt{color:var(--mut)}dl.dd dd{margin:0}
.fb label.i{margin:0;display:flex;align-items:center;gap:6px}.fb input[type=number]{width:92px}
.gm{display:grid;gap:12px;grid-template-columns:minmax(0,2fr) minmax(260px,1fr)}@media(max-width:760px){.gm{grid-template-columns:1fr}}
#lm,#hm{height:min(72vh,560px);min-height:340px;border-radius:10px;border:1px solid var(--bd);position:relative;z-index:0}
.hmk{font-size:17px;line-height:26px;text-align:center;background:#fff;border:2px solid #be123c;border-radius:50%;width:30px;height:30px;box-shadow:0 1px 4px #0007}
.wxd{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:10px}.wxd>div{border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center;background:var(--bg);font-size:13px}.wxd .e{font-size:26px;line-height:1.2}
.big{font-size:38px;font-weight:800;color:var(--ac);line-height:1.1}
.leaflet-container{font:inherit}.leaflet-popup-content{color:#0b1b36}

V.about=()=>`<h1>About TechTectonics</h1><div class="card"><p>TechTectonics — Sikkim DisasterConnect is a community-information prototype for landslides, flash floods, road blockages and earthquakes in Sikkim, built for a MyBharat social-impact initiative.</p><h2>What works now in this preview</h2><p class="mut">Dashboard with filters, schematic map, historical reported events (30-event dataset with filters, district summary, chart and details), incident reporting with validation, duplicate and rate checks, report tracking and withdrawal, road status with admin updates, alerts with two-person approval and expiry, service directory with admin-added contacts, audit log, CSV export. Data is saved in this browser (localStorage).</p><h2>Demo data</h2><p class="mut">All incidents, roads, alerts and directory entries are fictional or placeholders.</p><h2>Needs real configuration</h2><p class="mut">Supabase (PostgreSQL, Auth, Storage, row-level security) for shared data and real server-side roles · Leaflet + OpenStreetMap tiles · photo uploads · SMS/push channels · official road, weather and IMD/NDMA/SDMA data sources · verified emergency numbers · multilingual content · offline sync. Not included here and not claimed.</p></div>`;
V.privacy=()=>`<h1>Privacy policy and terms</h1><div class="card"><p class="mut">Reports contain only what you enter. Contact details are optional, stored in your browser in this preview, and never shown publicly. Withdrawing a report clears its contact details. A production deployment needs a retention policy, legal review and a data-deletion process (aligned with India’s DPDP Act, 2023). The Map, Weather and Hospitals pages contact third-party services (OpenStreetMap and OpenTopoMap/Esri map tiles, the Overpass API, and Open-Meteo), which receive your IP address and the area you are viewing. If you tap “Use my location”, your coordinates are used only in your browser and sent to those services to fetch the forecast or nearby hospitals; they are not stored by TechTectonics. TechTectonics is a community-information platform, not an emergency service, and gives no guarantee about route safety or incident accuracy.</p></div>`;

const HC={};
async function getHosp(lat,lon,rad){
 const key=lat.toFixed(2)+','+lon.toFixed(2)+','+rad;
 if(HC[key]&&Date.now()-HC[key].t<6e5)return HC[key].d;
 const r=rad*1000,q=`[out:json][timeout:25];(nwr["amenity"="hospital"](around:${r},${lat},${lon});nwr["healthcare"="hospital"](around:${r},${lat},${lon});nwr["amenity"="clinic"](around:${r},${lat},${lon}););out center tags 120;`;
 let err;
 for(const u of ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){
  try{
   const j=await jf(u,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)}),seen=new Set();
   const d=(j.elements||[]).map(e=>{const t=e.tags||{},la=e.lat!=null?e.lat:(e.center&&e.center.lat),lo=e.lon!=null?e.lon:(e.center&&e.center.lon),cl=t.amenity==='clinic';
    return{id:e.type+e.id,name:t.name||t['name:en']||(cl?'Clinic (name not listed)':'Hospital (name not listed)'),type:cl?'Clinic':'Hospital',lat:la,lon:lo,phone:t.phone||t['contact:phone']||'',addr:[t['addr:street'],t['addr:suburb']||t['addr:city']].filter(Boolean).join(', '),er:t.emergency==='yes',km:kmd(lat,lon,la,lo)}})
    .filter(x=>x.lat!=null&&x.lon!=null&&!seen.has(x.id)&&seen.add(x.id)).sort((a,b)=>a.km-b.km);
   HC[key]={t:Date.now(),d};return d;
  }catch(e){err=e}
 }
 throw err;
}
const mdet=()=>{const I=vis(),pick=sel&&(S.inc.find(i=>i.id===sel)||S.roads.find(r=>r.id===sel)),un=I.filter(i=>!hasLL(i)).length;
 return `<h2>Legend</h2>${SEV.map((s,k)=>sevB(k)).join('')}<br>${Object.keys(RS).map(k=>b('━ '+k,RS[k])).join('')}<div>${b('🏥 Hospital / clinic','#be123c')}</div><p class="mut">Dashed lines = not fully open. Never treat an unverified route as safe. Switch Terrain, Street or Satellite with the layer button on the map.</p><h2>Details</h2>${pick?(pick.cat?irow(pick)+`<p class="mut">Ref ${esc(pick.ref)} · approx. ${pick.lat}, ${pick.lon}</p><button class="s" onclick="flag('${pick.id}')">Report as misinformation</button> (${pick.fl||0} flags)`:`<b>${esc(pick.name)}</b><div>${b(pick.status,RS[pick.status])} ${esc(pick.dist)}</div><div class="mut">Updated ${fmt(pick.upd)} · Source: ${esc(pick.src)} · Not verified</div>`):'<p class="mut">Tap a marker or road. '+I.length+' incidents match the filters'+(un?' ('+un+' without coordinates are not on the map)':'')+'.</p>'}`};
const mpk=id=>{sel=id;const d=$('#mdet');if(d)d.innerHTML=mdet()};
V.map=()=>{if(typeof L==='undefined')return V.mapSvg();
 return `<h1>Disaster map</h1><div class="warn">Live map from OpenStreetMap with terrain and satellite views. Incident and road positions are approximate DEMO data.</div>${filt(1)}<div class="gm"><div class="card"><div id="lm" role="region" aria-label="Interactive map of Sikkim"></div><div class="fb" style="margin:8px 0 0"><button type="button" onclick="mapHosp()">🏥 Hospitals near map centre</button><button type="button" class="s" onclick="mapLoc()">📍 My location</button></div><div id="lmsg" class="mut" role="status"></div></div><div class="card" id="mdet">${mdet()}</div></div>`};
function initMap(){
 const el=$('#lm');if(!el||typeof L==='undefined')return;
 const {m,bases}=mkMap(el);LM=m;HM={};
 const I=vis().filter(hasLL),ig=L.layerGroup(),rg=L.layerGroup();HL=L.layerGroup();
 S.roads.filter(r=>(!F.d||r.dist===F.d)&&(!F.st||r.status===F.st)).forEach(r=>L.polyline(r.pts,{color:RS[r.status],weight:sel===r.id?8:5,dashArray:r.status==='Open'?null:'8 6',opacity:.9}).on('click',()=>mpk(r.id)).bindTooltip(r.name).addTo(rg));
 I.forEach(i=>L.circleMarker([+i.lat,+i.lon],{radius:sel===i.id?13:10,color:'#0a1428',weight:2,fillColor:SC[i.sev],fillOpacity:.95}).on('click',()=>mpk(i.id)).bindTooltip(i.cat+' · '+SEV[i.sev]).addTo(ig));
 rg.addTo(m);ig.addTo(m);HL.addTo(m);
 L.control.layers(bases,{'Incidents':ig,'Roads':rg,'Hospitals':HL},{collapsed:true}).addTo(m);
 L.control.scale({imperial:false}).addTo(m);
 if(MV)m.setView(MV.c,MV.z);else m.fitBounds([[27.05,88.0],[28.15,88.95]]);
 m.on('moveend',()=>{const c=m.getCenter();MV={c:[c.lat,c.lng],z:m.getZoom()}});
 setTimeout(()=>m.invalidateSize(),150);
}
async function mapHosp(){const msg=$('#lmsg');if(!LM)return;const c=LM.getCenter();msg.textContent='Searching for hospitals within 25 km of the map centre…';
 try{const d=await getHosp(c.lat,c.lng,25);if(!LM)return;addHosp(d);msg.textContent=d.length?d.length+' hospitals and clinics found. Straight-line distances only; by road it can take much longer. Data: OpenStreetMap volunteers, may be incomplete.':'No hospitals are listed in OpenStreetMap within 25 km of the map centre. Zoom to another area and try again.'}catch(e){msg.textContent='Could not load hospitals (no internet or the service is busy). Try again shortly.'}}
function mapLoc(){const msg=$('#lmsg');getPos((la,lo)=>{if(!LM)return;LM.setView([la,lo],12);L.circleMarker([la,lo],{radius:8,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1}).bindTooltip('You are here').addTo(LM);msg.textContent='Showing your location. Use "Hospitals near map centre" to find the nearest ones.'},t=>{msg.textContent=t})}

/* Weather (Open-Meteo, no key needed) */
const WC={0:['☀️','Clear'],1:['🌤️','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],45:['🌫️','Fog'],48:['🌫️','Freezing fog'],51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌧️','Heavy drizzle'],56:['🌧️','Freezing drizzle'],57:['🌧️','Freezing drizzle'],61:['🌧️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],66:['🌧️','Freezing rain'],67:['🌧️','Freezing rain'],71:['🌨️','Light snow'],73:['🌨️','Snow'],75:['❄️','Heavy snow'],77:['🌨️','Snow grains'],80:['🌦️','Showers'],81:['🌧️','Heavy showers'],82:['⛈️','Violent showers'],85:['🌨️','Snow showers'],86:['🌨️','Heavy snow showers'],95:['⛈️','Thunderstorm'],96:['⛈️','Thunderstorm, hail'],99:['⛈️','Severe thunderstorm, hail']};
const wc=c=>WC[c]||['🌡️','Unknown'];
let WP={n:'Gangtok',lat:HQ.Gangtok[0],lon:HQ.Gangtok[1]};
async function wxFetch(lat,lon){
 const key='ttwx:'+lat.toFixed(2)+','+lon.toFixed(2);
 try{const j=await jf('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&timezone=Asia%2FKolkata&forecast_days=7');
  try{localStorage.setItem(key,JSON.stringify({t:Date.now(),j}))}catch(e){}return{j,stale:0}}
 catch(e){try{const c=JSON.parse(localStorage.getItem(key));if(c&&c.j)return{j:c.j,stale:c.t}}catch(x){}throw e}
}
const rainB=mm=>mm>=115.6?b('Very heavy rain','#f43f5e'):mm>=64.5?b('Heavy rain','#fb923c'):mm>=15.6?b('Moderate rain','#facc15'):'';
V.weather=()=>`<h1>Weather forecast</h1><div class="warn">Forecast data from Open-Meteo. Mountain weather changes fast and valley forecasts can miss local downpours. Heavy rain can trigger landslides and flash floods in Sikkim, but this page is <b>not</b> a landslide prediction. Follow official IMD and state alerts.</div><div class="fb"><select id="wsel" aria-label="District" onchange="wxPick(this.value)">${opts(DS,WP.n)}</select><button class="s" type="button" onclick="wxLoc()">📍 Use my location</button></div><div class="card" id="wx" role="status">Loading forecast…</div>`;
function wxPick(v){WP={n:v,lat:HQ[v][0],lon:HQ[v][1]};wxLoad()}
function wxLoc(){getPos((la,lo)=>{WP={n:'your location',lat:la,lon:lo};wxLoad()},t=>{const e=$('#wx');if(e)e.innerHTML='<div class="err">'+esc(t)+'</div>'})}
async function wxLoad(){const el=$('#wx');if(!el)return;el.textContent='Loading forecast…';
 try{const {j,stale}=await wxFetch(WP.lat,WP.lon),c=j.current,d=j.daily,e=$('#wx');if(!e)return;const [ic,tx]=wc(c.weather_code);
  e.innerHTML=`<h2>${esc(WP.n)} ${WP.n!=='your location'?'<span class="mut" style="font-weight:400">(district HQ, approx.)</span>':''}</h2>${stale?'<div class="warn">You are offline. Showing the forecast saved '+fmt(stale)+'.</div>':''}<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="e" style="font-size:46px">${ic}</div><div><div class="big">${Math.round(c.temperature_2m)}°C</div><div>${tx} · feels like ${Math.round(c.apparent_temperature)}°C</div><div class="mut">Humidity ${c.relative_humidity_2m}% · Wind ${Math.round(c.wind_speed_10m)} km/h · Rain now ${c.precipitation} mm</div></div></div><h2 style="margin-top:14px">7-day forecast</h2><div class="wxd">${d.time.map((t,i)=>{const [e2,t2]=wc(d.weather_code[i]);return `<div><b>${new Date(t+'T00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}</b><div class="e">${e2}</div>${t2}<div><b>${Math.round(d.temperature_2m_max[i])}°</b> / ${Math.round(d.temperature_2m_min[i])}°</div><div class="mut">Rain ${d.precipitation_sum[i]} mm${d.precipitation_probability_max[i]!=null?' · '+d.precipitation_probability_max[i]+'%':''}</div>${rainB(d.precipitation_sum[i])}</div>`}).join('')}</div><p class="mut">Heavy rain here means 64.5 mm or more in 24 hours (India Meteorological Department scale). Updated ${fmt(new Date())}.</p>`
 }catch(x){const e=$('#wx');if(e)e.innerHTML='<div class="err">Could not load the forecast. Check your internet connection and try again.</div><button type="button" onclick="wxLoad()">Retry</button>'}}
async function homeWx(){const el=$('#hwx');if(!el)return;
 try{const {j}=await wxFetch(HQ.Gangtok[0],HQ.Gangtok[1]),e=$('#hwx');if(!e)return;const c=j.current,d=j.daily,[ic,tx]=wc(c.weather_code);
  e.innerHTML=`<h2>Weather in Gangtok</h2><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="font-size:34px">${ic}</span><span><b style="font-size:22px">${Math.round(c.temperature_2m)}°C</b> ${tx}<br><span class="mut">Today ${Math.round(d.temperature_2m_max[0])}° / ${Math.round(d.temperature_2m_min[0])}° · rain ${d.precipitation_sum[0]} mm · next 3 days: ${[1,2,3].map(i=>d.precipitation_sum[i]+' mm').join(', ')}</span></span> ${rainB(Math.max(...d.precipitation_sum.slice(0,3)))}</div><a href="#/weather"><button type="button" class="s" style="margin-top:8px">Full forecast for every district</button></a>`
 }catch(x){const e=$('#hwx');if(e)e.innerHTML='<h2>Weather in Gangtok</h2><span class="mut">Forecast unavailable offline. </span><a href="#/weather" style="color:var(--ac)">Try the weather page</a>'}}

/* Nearby hospitals (OpenStreetMap data via Overpass) */
let HP={n:'Gangtok',lat:HQ.Gangtok[0],lon:HQ.Gangtok[1],rad:25};
V.hospitals=()=>`<h1>Nearby hospitals</h1><div class="warn"><b>In an emergency call 112.</b> Distances are straight-line; by road in the hills the trip can be much longer and roads may be blocked, so check the <a href="#/roads" style="color:var(--ac)">Roads</a> page. Hospital data comes from OpenStreetMap volunteers and may be incomplete or out of date. Call ahead to confirm services.</div><div class="fb"><select id="hsel" aria-label="District" onchange="hpPick(this.value)">${opts(DS,HP.n)}</select><select id="hrad" aria-label="Search radius" onchange="HP.rad=+this.value;hpLoad()">${[10,25,50].map(r=>`<option value="${r}" ${HP.rad===r?'selected':''}>Within ${r} km</option>`).join('')}</select><button class="s" type="button" onclick="hpLoc()">📍 Use my location</button></div><div class="${typeof L!=='undefined'?'gm':''}">${typeof L!=='undefined'?'<div class="card"><div id="hm" role="region" aria-label="Map of nearby hospitals"></div></div>':''}<div class="card" id="hl" role="status">Searching…</div></div>`;
function hpPick(v){HP.n=v;HP.lat=HQ[v][0];HP.lon=HQ[v][1];hpLoad()}
function hpLoc(){getPos((la,lo)=>{HP.n='your location';HP.lat=la;HP.lon=lo;hpLoad()},t=>{const e=$('#hl');if(e)e.innerHTML='<div class="err">'+esc(t)+'</div>'})}
function hpFocus(id){const m=HM[id];if(!m||!LM)return;LM.setView(m.getLatLng(),14);m.openPopup();const e=$('#hm');if(e)e.scrollIntoView({block:'center',behavior:'smooth'})}
async function hpLoad(){const el=$('#hl');if(!el)return;el.textContent='Searching OpenStreetMap for hospitals within '+HP.rad+' km of '+HP.n+'…';
 if(typeof L!=='undefined'&&$('#hm')){if(LM){LM.remove();LM=null}const {m}=mkMap($('#hm'));LM=m;HM={};HL=L.layerGroup().addTo(m);m.setView([HP.lat,HP.lon],10);L.circleMarker([HP.lat,HP.lon],{radius:8,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1}).bindTooltip(HP.n==='your location'?'You are here':HP.n+' (district HQ)').addTo(m);setTimeout(()=>m.invalidateSize(),150)}
 try{const d=await getHosp(HP.lat,HP.lon,HP.rad),e=$('#hl');if(!e)return;
  if(LM){addHosp(d);if(d.length)LM.fitBounds(L.latLngBounds(d.slice(0,15).map(h=>[h.lat,h.lon]).concat([[HP.lat,HP.lon]])),{padding:[30,30],maxZoom:13})}
  e.innerHTML=`<h2>${d.length} found near ${esc(HP.n)}</h2>`+(d.slice(0,40).map(h=>`<div class="row"><b>${esc(h.name)}</b> ${b(h.type,h.type==='Hospital'?'#be123c':'#0e7490')}${h.er?b('Emergency','#f43f5e'):''}<div class="mut">${h.km.toFixed(1)} km straight-line${h.addr?' · '+esc(h.addr):''}${h.phone?' · <a style="color:var(--ac)" href="tel:'+esc(h.phone.replace(/[^\d+]/g,''))+'">'+esc(h.phone)+'</a>':' · phone not listed'}</div><a style="color:var(--ac)" href="https://www.google.com/maps/dir/?api=1&destination=${h.lat},${h.lon}" target="_blank" rel="noopener">Directions</a>${LM?` · <a href="#" style="color:var(--ac)" onclick="hpFocus('${h.id}');return false">Show on map</a>`:''}</div>`).join('')||'<p class="mut">No hospitals or clinics are listed in OpenStreetMap within this radius. Try a larger radius or another district.</p>')+(d.length>40?'<p class="mut">Showing the nearest 40.</p>':'')
 }catch(x){const e=$('#hl');if(e)e.innerHTML='<div class="err">Could not load hospitals. Check your internet connection and try again.</div><button type="button" onclick="hpLoad()">Retry</button>'}}
const NAV=[['home','Dashboard'],['map','Map'],['weather','Weather'],['hospitals','Hospitals'],['report','Report'],['roads','Roads'],['alerts','Alerts'],['services','Services'],['history','History'],['mine','My reports'],['admin','Admin'],['about','About']];
function go(){let r=location.hash.replace('#/','')||'home';if(!V[r])r='home';const u=S.alerts.filter(a=>live(a)&&!S.read[a.id]).length;
$('#nav').innerHTML=NAV.map(([k,t])=>`<a href="#/${k}" class="${k===r?'on':''}">${t}${k==='alerts'&&u?' ('+u+')':''}</a>`).join('');
$('#role').innerHTML=Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k===R()?'selected':''}>${v}</option>`).join('');
if(LM){LM.remove();LM=null}$('#app').innerHTML=V[r]();if(r==='map')initMap();if(r==='weather')wxLoad();if(r==='hospitals')hpLoad();if(r==='home')homeWx();if(r==='roads')rl();if(r==='services')sl();if(r==='history')hr()}
const setRole=v=>{S.role=v;save();go()};
let th='dark';try{th=localStorage.getItem('tnxth')||'dark'}catch(e){}document.documentElement.dataset.theme=th;
const tog=()=>{th=th==='dark'?'light':'dark';document.documentElement.dataset.theme=th;try{localStorage.setItem('tnxth',th)}catch(e){}};
addEventListener('hashchange',()=>{F.q='';go();scrollTo(0,0)});go();
</script></body></html>
